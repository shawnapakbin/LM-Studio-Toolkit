name: Installer Release

on:
  workflow_dispatch:
  push:
    tags:
      - "installer-v*"

permissions:
  contents: write

jobs:
  build-installer:
    # Windows is the only target platform in scope; macOS and Linux are deferred (Req 10.3).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Installer/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck installer
        run: npm run -w Installer typecheck

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Installer
          tauriScript: npx tauri

      - name: Locate build artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="Installer/src-tauri/target/release/bundle"
          echo "bundle_dir=${BUNDLE_DIR}" >> "$GITHUB_OUTPUT"

          # Windows-only: the NSIS bundler emits the setup.exe under bundle/nsis/.
          ARTIFACT=$(find "${BUNDLE_DIR}/nsis" -name "*.exe" 2>/dev/null | head -1)

          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Found artifact: ${ARTIFACT}"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          ARTIFACT="${{ steps.artifacts.outputs.artifact }}"
          if [ -n "${ARTIFACT}" ] && [ -f "${ARTIFACT}" ]; then
            CHECKSUM_FILE="${ARTIFACT}.sha256"
            shasum -a 256 "${ARTIFACT}" | awk '{print $1 "  " FILENAME}' FILENAME="$(basename "${ARTIFACT}")" > "${CHECKSUM_FILE}"
            echo "Generated checksum: $(cat "${CHECKSUM_FILE}")"
          else
            echo "::error::No artifact found to generate checksum for"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: Installer/src-tauri/target/release/bundle/nsis/*.exe
          # Atomic pairing (Req 10.6): a missing setup.exe fails the job so no
          # publish outcome can contain only the checksum.
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ runner.os }}
          path: Installer/src-tauri/target/release/bundle/nsis/*.sha256
          # Atomic pairing (Req 10.6): a missing checksum fails the job so no
          # publish outcome can contain only the setup.exe.
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify atomic exe+checksum pair
        shell: bash
        run: |
          # Atomic publish guard (Req 10.6, Property 12): the setup.exe and its
          # .sha256 must be published as a pair or not at all. Fail before the
          # release is created if exactly one of the two is present, so we never
          # publish a partial pair.
          EXE_COUNT=$(find artifacts -type f -name '*.exe' | wc -l | tr -d ' ')
          SHA_COUNT=$(find artifacts -type f -name '*.sha256' | wc -l | tr -d ' ')
          echo "Found ${EXE_COUNT} .exe artifact(s) and ${SHA_COUNT} .sha256 artifact(s)"

          if [ "${EXE_COUNT}" -eq 0 ] || [ "${SHA_COUNT}" -eq 0 ]; then
            echo "::error::Atomic publish aborted: expected a setup.exe and its .sha256 as a pair, found exe=${EXE_COUNT} sha256=${SHA_COUNT}. Publishing neither."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Both members of the pair are verified present above before this runs.
          files: |
            artifacts/installer-*/**/*.exe
            artifacts/checksum-*/**/*.sha256
