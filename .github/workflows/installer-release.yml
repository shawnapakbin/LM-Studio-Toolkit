name: Installer Release

on:
  workflow_dispatch:
  push:
    tags:
      - "installer-v*"

permissions:
  contents: write

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Installer/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Typecheck installer
        run: npm run -w Installer typecheck

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Installer
          tauriScript: npx tauri

      - name: Locate build artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="Installer/src-tauri/target/release/bundle"
          echo "bundle_dir=${BUNDLE_DIR}" >> "$GITHUB_OUTPUT"

          # Find installer artifacts by platform
          if [ "${{ runner.os }}" = "Windows" ]; then
            ARTIFACT=$(find "${BUNDLE_DIR}/nsis" -name "*.exe" 2>/dev/null | head -1)
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ARTIFACT=$(find "${BUNDLE_DIR}/dmg" -name "*.dmg" 2>/dev/null | head -1)
          else
            ARTIFACT=$(find "${BUNDLE_DIR}/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          fi

          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Found artifact: ${ARTIFACT}"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          ARTIFACT="${{ steps.artifacts.outputs.artifact }}"
          if [ -n "${ARTIFACT}" ] && [ -f "${ARTIFACT}" ]; then
            CHECKSUM_FILE="${ARTIFACT}.sha256"
            shasum -a 256 "${ARTIFACT}" | awk '{print $1 "  " FILENAME}' FILENAME="$(basename "${ARTIFACT}")" > "${CHECKSUM_FILE}"
            echo "Generated checksum: $(cat "${CHECKSUM_FILE}")"
          else
            echo "::error::No artifact found to generate checksum for"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            Installer/src-tauri/target/release/bundle/nsis/*.exe
            Installer/src-tauri/target/release/bundle/dmg/*.dmg
            Installer/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ runner.os }}
          path: |
            Installer/src-tauri/target/release/bundle/nsis/*.sha256
            Installer/src-tauri/target/release/bundle/dmg/*.sha256
            Installer/src-tauri/target/release/bundle/appimage/*.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer-*/**/*.exe
            artifacts/installer-*/**/*.dmg
            artifacts/installer-*/**/*.AppImage
            artifacts/checksum-*/**/*.sha256
