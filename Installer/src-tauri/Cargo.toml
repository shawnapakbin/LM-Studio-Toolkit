[package]
name = "llm-toolkit-installer"
version = "5.4.4"
description = "Native Windows installer for LLM Toolkit"
authors = ["Shawna Pakbin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
winreg = "0.56"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
which = "7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
proptest = "1.11"
